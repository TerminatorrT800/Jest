<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
<script defer src="bundle.js"></script></head>
<body>
    <h1>Battleship Game</h1>

  <div class="board-container">
    <div>
      <h3 id="PlayerOneName">Player One Board</h3>
      <div id="player-board" class="board">

      </div>
    </div>
    <div>
      <h3 id="PlayerTwoName">Player Two Board</h3>
      <div id="enemy-board" class="board">
        
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="start-btn">Start Game</button>
    <button id="reset-btn">Restart</button>
  </div>


<div id="config-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Game Setup</h2>

    <label>Player 1 Name:</label>
    <input type="text" id="p1-name" placeholder="Igrac" />

    <label>Player 2 Name:</label>
    <input type="text" id="p2-name" placeholder="Razbijac" />

    <label>Board Size:</label>
    <input type="number" id="board-size" min="5" max="15" value="10" />

    <label>Ship Count:</label>
    <input type="number" id="ship-count" min="1" max="6" value="3" />

    <label class="toggle-row">
      <input type="checkbox" id="cpu-toggle" />
      Play vs CPU
    </label>

    <div class="modal-buttons">
      <button id="cancel-config">Cancel</button>
      <button id="confirm-config">Start</button>
    </div>
  </div>
</div>

</body>
</html>
