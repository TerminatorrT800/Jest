<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <div class="header">
        <h1>Battleship Game</h1>
        <p>Welcome to the Battleship game! Try to sink all the enemy ships.</p>
    </div>
    <div class="game-container">
        <div class="player-board">
            <h2>Your Board</h2>
            <div class="board" id="p1-board"></div>
        </div>
        <div class="enemy-board">
            <h2>Enemy Board</h2>
            <div class="board" id="p2-board"></div>
        </div>
        <div class="controls">
            <button id="start-game" type="button">Start Game</button>
            <button id="reset-game" type="button">Reset Game</button>
        </div>
    </div>
</body>
</html>
